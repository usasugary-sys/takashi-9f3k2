<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#191a23">
<title>たかし君は我が強い 説得編</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Rampart+One&family=DotGothic16&family=Zen+Kaku+Gothic+New:wght@700;900&display=swap" rel="stylesheet">
<style>

:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --night:#191a23; --asphalt:#2c2e3a; --line:#f2efe6;
  --yellow:#ffd23f; --magenta:#ff2e88; --orange:#ff7a1a; --ink:#15161d;
  --panel:#ffffff; --panel-ink:#15161d; --soft:#8b8fa3;
  --ui:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;
  --logo:"Dela Gothic One","Hiragino Sans","Yu Gothic",sans-serif;
  --shout:"Rampart One","Dela Gothic One","Hiragino Sans",sans-serif;
  --dot:"DotGothic16","Hiragino Kaku Gothic ProN","Yu Gothic",monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--panel:#f4f1ea;--night:#14151c}}
:root[data-theme="dark"]{--panel:#f4f1ea;--night:#14151c}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:var(--night)}
body{height:100%;overflow:hidden;background:var(--night);color:#fff;font-family:var(--ui);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--yellow);outline-offset:3px}
#app{position:relative;height:100%;max-width:500px;margin:0 auto;overflow:hidden}
.screen{position:absolute;inset:0;display:none}
.screen.active{display:block}

/* ---------- portraits ---------- */
.por{width:100%;height:auto;display:block;overflow:visible}
.p-tk .e-s,.p-tk .m-s,.p-tk .fx{display:none}
.p-tk.shriek .e-n,.p-tk.shriek .m-n{display:none}
.p-tk.shriek .e-s,.p-tk.shriek .m-s,.p-tk.shriek .fx{display:inline}
.p-tk.shriek .head{animation:vib .05s linear infinite}
.p-mt .e-c{display:none}.p-mt.sigh .e-o{display:none}.p-mt.sigh .e-c{display:inline}
@keyframes vib{0%{transform:translate(-2px,1px)}50%{transform:translate(2px,-1px)}100%{transform:translate(-1px,-1px)}}
.sway{animation:breathe 2.4s ease-in-out infinite;transform-origin:100px 220px}
@keyframes breathe{50%{transform:scaleY(1.012)}}

/* ---------- title ---------- */
#scr-title{background:var(--asphalt);overflow:hidden}
.road-bg{position:absolute;inset:0;background:
  linear-gradient(90deg,#2f4a3a 0 9%,#e9e6dc 9% 10%,transparent 10% 90%,#e9e6dc 90% 91%,#2f4a3a 91%),
  repeating-linear-gradient(180deg,var(--line) 0 34px,transparent 34px 80px) 50% 0/4px 100% no-repeat,
  repeating-linear-gradient(180deg,rgba(242,239,230,.5) 0 34px,transparent 34px 80px) 30% 0/3px 100% no-repeat,
  repeating-linear-gradient(180deg,rgba(242,239,230,.5) 0 34px,transparent 34px 80px) 70% 0/3px 100% no-repeat,
  var(--asphalt);animation:roll .5s linear infinite}
@keyframes roll{to{background-position:0 0,50% 80px,30% 80px,70% 80px,0 0}}
.title-in{position:relative;height:100%;display:flex;flex-direction:column;align-items:center;padding:28px 20px 22px;background:linear-gradient(rgba(25,26,35,.72),rgba(25,26,35,.25) 45%,rgba(25,26,35,.85))}
.logo{text-align:center;line-height:1;transform:rotate(-4deg);margin-top:10px}
.logo .a{display:block;font-family:var(--logo);font-size:1.5rem;letter-spacing:.08em}
.logo .b{display:block;font-family:var(--logo);font-size:3.6rem;margin-top:8px;color:#fff;text-shadow:4px 4px 0 var(--orange),8px 8px 0 var(--ink)}
.logo .c{display:inline-block;margin-top:14px;background:var(--yellow);color:var(--ink);font-weight:900;padding:4px 14px;border-radius:4px;transform:skewX(-12deg);font-size:.95rem}
.title-tk{flex:1;min-height:0;display:flex;align-items:flex-end;justify-content:center;width:100%;margin:10px 0 8px;position:relative}
.title-tk .por{width:auto;height:100%;max-height:300px;cursor:pointer}
.title-hint{position:absolute;right:6%;top:18%;background:#fff;color:var(--ink);font-weight:900;font-size:.8rem;padding:6px 10px;border-radius:12px;border:3px solid var(--ink);transform:rotate(6deg)}
.title-hint::after{content:"";position:absolute;left:12px;bottom:-11px;border:7px solid transparent;border-top-color:var(--ink)}
.cta{display:flex;flex-direction:column;gap:10px;width:100%;max-width:340px}
.btn{display:block;width:100%;border-radius:14px;padding:14px;font-weight:900;font-size:1.05rem;background:#fff;color:var(--ink);border:3px solid var(--ink);box-shadow:0 5px 0 var(--ink);transition:transform .07s,box-shadow .07s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn.go{background:var(--orange);color:#fff;font-size:1.25rem;padding:16px}
.btn.row{display:flex;gap:10px;background:none;border:none;box-shadow:none;padding:0}
.btn.row .btn{flex:1}
.best{margin-top:12px;font-size:.8rem;color:#c9ccd9;font-weight:700}
.best b{color:var(--yellow);font-size:1rem}
.mute{position:absolute;right:12px;top:12px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.12);font-size:1.1rem;z-index:3}

/* ---------- game ---------- */
#scr-game{background:var(--asphalt)}
#stage{position:absolute;inset:0;touch-action:none}
#cv{position:absolute;left:0;top:0;display:block}
.hud{position:absolute;left:0;right:0;top:0;padding:10px 12px 18px;pointer-events:none;background:linear-gradient(rgba(21,22,29,.85),rgba(21,22,29,0));z-index:5}
.hud-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.dist{line-height:1}
.dist b{font-family:var(--logo);font-size:2rem;font-variant-numeric:tabular-nums}
.dist small{font-weight:900;margin-left:2px}
.dist .kmh{display:block;font-size:.72rem;color:#c9ccd9;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}
.sc{text-align:right;line-height:1.1}
.sc small{display:block;font-size:.66rem;color:#c9ccd9;font-weight:700}
.sc b{font-size:1.25rem;font-weight:900;font-variant-numeric:tabular-nums}
.pause{pointer-events:auto;width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.14);font-weight:900;font-size:1rem;flex:none}
.hud-mid{display:flex;align-items:center;gap:10px;margin-top:8px}
.hp{display:flex;gap:4px;flex:none}
.hp i{width:14px;height:22px;border-radius:5px;background:var(--orange);border:2px solid #fff;display:block;transition:opacity .3s,transform .3s}
.hp i.heal{animation:heal .5s cubic-bezier(.3,1.8,.5,1)}
@keyframes heal{0%{transform:scale(2);background:#7dffb0}}
.hp i.lost{opacity:.2;transform:scale(.7) rotate(25deg)}
.gauge{flex:1;display:flex;align-items:center;gap:6px;position:relative}
.face{width:38px;height:38px;border-radius:50%;background:#2d6cdf;border:3px solid #fff;overflow:hidden;flex:none;position:relative}
.face .por{position:absolute;left:-2px;top:-3px;width:40px}
.gbar{flex:1;height:14px;border-radius:99px;background:rgba(255,255,255,.14);overflow:hidden;border:2px solid rgba(255,255,255,.5)}
.gbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--yellow),var(--orange) 60%,var(--magenta));border-radius:99px}
.gauge.full .gbar{animation:hot .18s linear infinite alternate}
.gauge.full .face{animation:vib .06s linear infinite}
@keyframes hot{to{box-shadow:0 0 14px var(--magenta);border-color:var(--magenta)}}
.glabel{font-size:.7rem;font-weight:900;color:#c9ccd9;flex:none}
.tkline{position:absolute;left:44px;top:40px;background:#fff;color:var(--ink);font-weight:900;font-size:.82rem;padding:5px 10px;border-radius:10px;border:2.5px solid var(--ink);white-space:nowrap;opacity:0;transform:translateY(-4px);transition:opacity .15s,transform .15s}
.tkline.on{opacity:1;transform:none}
.tkline::before{content:"";position:absolute;left:10px;top:-10px;border:6px solid transparent;border-bottom-color:var(--ink)}

#shout{position:absolute;left:0;right:0;top:30%;text-align:center;font-family:var(--shout);font-size:min(9.6vw,52px);color:var(--magenta);text-shadow:0 0 18px rgba(255,46,136,.8),3px 3px 0 #fff;pointer-events:none;z-index:30;display:none;white-space:nowrap;line-height:1.1}
#shout.on{display:block;animation:shout 1.15s cubic-bezier(.2,1.4,.4,1) both}
@keyframes shout{0%{transform:scale(3) rotate(-14deg);opacity:0}12%{transform:scale(1) rotate(-6deg);opacity:1}20%{transform:scale(1.08) rotate(-4deg)}80%{opacity:1;transform:scale(1.02) rotate(-6deg)}100%{opacity:0;transform:scale(1.4) rotate(-6deg)}}
#count{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-family:var(--logo);font-size:5rem;z-index:15;pointer-events:none;text-shadow:5px 5px 0 var(--ink)}
#count.on{display:flex}
#count span{animation:cnt .7s ease-out both}
@keyframes cnt{0%{transform:scale(2);opacity:0}25%{transform:scale(1);opacity:1}100%{opacity:0}}
.cutin{position:absolute;left:10px;top:150px;display:flex;align-items:center;gap:6px;z-index:6;pointer-events:none;transform:translateX(-130%);transition:transform .28s cubic-bezier(.3,1.4,.5,1)}
.cutin.on{transform:none}
.cutin .cf{width:48px;height:48px;border-radius:50%;border:3px solid #fff;overflow:hidden;background:var(--yellow);position:relative;flex:none}
.cutin .cf .por{position:absolute;inset:0;width:100%;height:100%}
.cutin .cb{background:#fff;color:var(--ink);font-weight:900;padding:5px 11px 6px;border-radius:12px;border:2.5px solid var(--ink);font-size:.95rem;line-height:1.25;white-space:nowrap}
.cutin .cb small{display:block;font-size:.62rem;color:#6a6d7c}
.band{position:absolute;left:0;right:0;top:36%;z-index:12;pointer-events:none;display:none}
.band.on{display:block;animation:bandIn 1.05s cubic-bezier(.2,.9,.3,1) both}
.band-in{display:flex;align-items:center;gap:14px;padding:10px 18px;background:var(--bc,#ff8fc8);color:var(--ink);transform:skewY(-4deg);border-top:4px solid var(--ink);border-bottom:4px solid var(--ink);box-shadow:0 10px 30px rgba(0,0,0,.45)}
.band-face{width:84px;height:84px;border-radius:50%;background:#fff;border:4px solid var(--ink);overflow:hidden;flex:none;position:relative}
.band-face .por{position:absolute;inset:0;width:100%;height:100%}
.band-txt b{display:block;font-family:var(--logo);font-weight:400;font-size:1.9rem;line-height:1.1}
.band-txt span{font-weight:900;font-size:1rem}
@keyframes bandIn{0%{transform:translateX(-110%)}16%{transform:translateX(0)}84%{transform:translateX(0);opacity:1}100%{transform:translateX(110%);opacity:.6}}
.hint-drag{position:absolute;left:0;right:0;bottom:12%;text-align:center;font-weight:900;font-size:.9rem;color:#fff;opacity:0;pointer-events:none;z-index:6;transition:opacity .4s}
.hint-drag.on{opacity:.9}
.hint-drag span{display:inline-block;background:rgba(21,22,29,.75);padding:8px 14px;border-radius:99px;border:2px solid rgba(255,255,255,.3)}

/* ---------- VN ---------- */
.vn{position:absolute;inset:0;display:none;flex-direction:column;z-index:20}
.vn.on{display:flex}
.vn.bg-park{background:
  repeating-linear-gradient(90deg,transparent 0 58px,rgba(242,239,230,.55) 58px 61px) 0 72%/100% 28% no-repeat,
  linear-gradient(#2a2350 0%,#6b3a6e 34%,#e0714f 56%,#f5a45a 61%,#353646 61.3%,#2b2d3a 100%)}
.vn.bg-crash{background:radial-gradient(circle at 70% 38%,rgba(255,140,40,.45),transparent 38%),linear-gradient(#0f1020 0%,#26283a 40%,#2c2e3a 41%,#1c1d27 100%)}
.vn.bg-over{background:rgba(12,12,20,.62)}
.vn-chars{position:relative;flex:1;min-height:0}
.vc{position:absolute;bottom:-4px;width:64%;max-width:310px;transform:translateX(-50%);transition:opacity .25s,filter .25s,left .35s}
.vc.n3{width:40%;max-width:190px}
.vc.hide{opacity:0}
.vc.dim{filter:brightness(.5) saturate(.6)}
.vc.enter{animation:enter .35s ease-out}
@keyframes enter{from{transform:translate(-50%,40px);opacity:0}}
.vn-box{position:relative;margin:0 12px 14px;background:rgba(18,18,28,.94);border:3px solid #fff;border-radius:14px;padding:24px 18px 20px;min-height:118px;font-family:var(--dot);font-size:1.15rem;line-height:1.65;flex:none}
.vn-name{position:absolute;top:-17px;left:14px;background:var(--yellow);color:var(--ink);font-family:var(--ui);font-weight:900;font-size:.9rem;padding:3px 12px;border-radius:8px;border:3px solid var(--ink)}
.vn-name:empty{display:none}
.vn-next{position:absolute;right:16px;bottom:8px;font-size:.8rem;animation:blink .8s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.vn-skip{position:absolute;right:12px;top:12px;background:rgba(255,255,255,.14);border-radius:99px;padding:7px 14px;font-weight:900;font-size:.8rem;z-index:2}
.vn.quake{animation:vib .05s linear 10}

/* ---------- modal ---------- */
.modal{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(10,10,16,.7);z-index:40}
.modal.on{display:flex}
.sheet{width:100%;max-width:380px;max-height:100%;overflow-y:auto;background:var(--panel);color:var(--panel-ink);border-radius:18px;border:3px solid var(--ink);padding:20px 18px 18px;box-shadow:0 8px 0 var(--ink)}
.sheet h3{font-family:var(--logo);font-weight:400;font-size:1.35rem;margin-bottom:12px}
.how{list-style:none;display:flex;flex-direction:column;gap:12px;margin-bottom:16px}
.how li{display:flex;gap:12px;align-items:flex-start;font-weight:700;font-size:.92rem;line-height:1.55}
.how .ic{width:44px;height:44px;border-radius:12px;background:var(--asphalt);display:grid;place-items:center;flex:none;font-size:1.3rem}
.how b{color:#d9166f}
.sheet .btn+.btn{margin-top:10px}

/* ---------- result ---------- */
#scr-result{background:var(--asphalt);overflow-y:auto}
.res-in{min-height:100%;display:flex;flex-direction:column;justify-content:center;padding:22px 16px}
.lic{background:#fbfaf4;color:var(--ink);border-radius:14px;overflow:hidden;border:3px solid var(--ink);box-shadow:0 8px 0 var(--ink)}
.lic-top{background:linear-gradient(90deg,#3f8f6a,#8bc34a);color:#fff;padding:10px 14px;display:flex;justify-content:space-between;align-items:center}
.lic-top b{font-family:var(--logo);font-weight:400;font-size:1.05rem;letter-spacing:.08em}
.lic-top span{font-size:.7rem;font-weight:700}
.lic-body{display:flex;gap:12px;padding:14px}
.photo{width:92px;height:112px;border-radius:6px;background:#6f9fe6;border:2px solid var(--ink);overflow:hidden;flex:none;position:relative}
.photo .por{position:absolute;left:-14px;top:0;width:122px}
.fields{flex:1;display:flex;flex-direction:column;gap:3px;font-size:.84rem}
.fields div{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px dashed #c9c5b6;padding:3px 0}
.fields span{color:#5f6272;font-weight:700}
.fields b{font-weight:900;font-variant-numeric:tabular-nums}
.fields .big b{font-family:var(--logo);font-weight:400;font-size:1.25rem;color:#d9166f}
.lic-rank{display:flex;align-items:center;gap:12px;padding:0 14px 14px}
.hanko{width:72px;height:72px;font-family:var(--logo);font-size:1.25rem!important;border-radius:50%;border:3.5px solid #d9166f;color:#d9166f;display:grid;place-items:center;text-align:center;font-weight:900;font-size:.95rem;line-height:1.1;transform:rotate(-12deg);flex:none}
.hanko.hit{animation:stamp .45s cubic-bezier(.3,1.5,.5,1) both}
@keyframes stamp{0%{transform:scale(2.4) rotate(-30deg);opacity:0}100%{transform:scale(1) rotate(-12deg);opacity:1}}
.lic-rank small{display:block;font-size:.7rem;color:#5f6272;font-weight:700}
.lic-rank strong{font-size:1.15rem;font-weight:900}
.newbest{display:inline-block;margin-left:6px;background:var(--yellow);border-radius:99px;padding:1px 8px;font-size:.66rem;font-weight:900;vertical-align:middle}
.res-talk{display:flex;align-items:flex-end;gap:10px;margin:18px 0 16px}
.res-talk .mini{width:84px;flex:none;text-align:center}.mini-name{display:inline-block;margin-top:-4px;background:var(--yellow);color:var(--ink);font-weight:900;font-size:.72rem;padding:1px 8px;border-radius:6px;border:2px solid var(--ink);position:relative}
.bub{position:relative;flex:1;background:#fff;color:var(--ink);border:3px solid var(--ink);border-radius:14px;padding:10px 12px;font-family:var(--dot);font-size:1rem;line-height:1.5;margin-bottom:18px;min-height:48px}
.bub::before{content:"";position:absolute;left:-15px;bottom:12px;border:8px solid transparent;border-right:14px solid var(--ink);border-left:0}
.copied{text-align:center;font-size:.75rem;color:#c9ccd9;margin-top:10px;min-height:1em}

.ach-head{display:flex;justify-content:space-between;align-items:baseline}
.ach-head b{font-weight:900;color:#d9166f}
.ach-bar{height:8px;border-radius:99px;background:#e3e0d8;overflow:hidden;margin:2px 0 12px}
.ach-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--yellow),var(--orange));width:0}
.ach-sec{font-weight:900;font-size:.8rem;color:#5f6272;margin:10px 0 6px}
.ach-list{list-style:none;display:flex;flex-direction:column;gap:7px}
.ach{display:flex;gap:10px;align-items:center;padding:7px 10px;border-radius:12px;border:2px solid #d8d4c8;background:#fff}
.ach .ai{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-size:1.3rem;background:var(--yellow);flex:none}
.ach b{display:block;font-size:.92rem;line-height:1.3}
.ach small{display:block;font-size:.75rem;color:#5f6272;line-height:1.4}
.ach.locked{background:#f1efe8;border-style:dashed}
.ach.locked .ai{background:#dcd9d0;filter:grayscale(1);opacity:.6}
.ach.locked b{color:#9a9aa5}
.ach-reset{display:block;margin:12px auto 0;font-size:.75rem;color:#8b8fa3;text-decoration:underline}
.ach-new{text-align:center;font-weight:900;font-size:.85rem;color:var(--yellow);margin-top:6px;min-height:1em}
#achToast{position:absolute;left:50%;bottom:16px;transform:translate(-50%,160%);z-index:45;background:var(--ink);color:#fff;border:3px solid var(--yellow);border-radius:14px;padding:7px 16px 7px 8px;display:flex;gap:10px;align-items:center;transition:transform .35s cubic-bezier(.3,1.4,.5,1);pointer-events:none;white-space:nowrap;box-shadow:0 8px 20px rgba(0,0,0,.5)}
#achToast.on{transform:translate(-50%,0)}
#achToast .ti{width:38px;height:38px;border-radius:10px;background:var(--yellow);display:grid;place-items:center;font-size:1.3rem}
#achToast small{display:block;font-size:.66rem;color:var(--yellow);font-weight:900}
#achToast b{font-weight:900;font-size:.95rem}
@media (max-height:640px){.logo .b{font-size:3rem}.vn-box{min-height:100px;font-size:1.05rem}}
@media (prefers-reduced-motion:reduce){.road-bg{animation:none}.sway{animation:none}}

/* ===== persuasion ===== */
#scr-title{background:#232033}
.ptitle-bg{position:absolute;inset:0;background:radial-gradient(circle at 50% 62%,#ff7a1a33 0 30%,transparent 60%),repeating-linear-gradient(135deg,#232033 0 22px,#2a2640 22px 44px)}
.logo .c.pers{background:var(--magenta);color:#fff}
.psub{margin-top:10px;font-family:var(--dot);font-size:.9rem;color:#e8e4ff}
#scr-select{background:#232033;overflow-y:auto}
.sel-in{min-height:100%;padding:22px 16px;display:flex;flex-direction:column;gap:10px}
.sel-in h2{font-family:var(--logo);font-weight:400;font-size:1.5rem;margin-bottom:4px}
.sel-in .note{font-size:.8rem;color:#c9ccd9;margin-bottom:6px}
.ep{display:flex;align-items:center;gap:12px;text-align:left;width:100%;background:#fff;color:var(--ink);border:3px solid var(--ink);border-radius:14px;padding:12px 14px;box-shadow:0 5px 0 var(--ink)}
.ep:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.ep .no{font-family:var(--logo);font-size:1.3rem;width:44px;height:44px;border-radius:12px;background:var(--orange);color:#fff;display:grid;place-items:center;flex:none}
.ep b{display:block;font-size:1rem}
.ep small{display:block;font-size:.75rem;color:#5f6272;font-weight:700}
.ep .st{margin-left:auto;font-size:1.05rem;letter-spacing:.05em;color:#f0a500;white-space:nowrap}
.ep:disabled{opacity:.45;box-shadow:0 5px 0 #555}
.ep:disabled .no{background:#8b8fa3}
#scr-talk{overflow:hidden}
#scr-talk.quake{animation:vib .05s linear 10}
.tbg{position:absolute;inset:0;transition:filter .3s}

.bg-parkday{background:radial-gradient(circle at 14% 50%,#3f7a34 0 13%,transparent 13.5%),radial-gradient(circle at 88% 46%,#3f7a34 0 11%,transparent 11.5%),linear-gradient(#8fd3ff 0 56%,#7cc46a 56%)}
.bg-river{background:radial-gradient(circle at 80% 14%,#fff7d6 0 4%,transparent 4.5%),radial-gradient(circle at 20% 10%,#fff 0 .4%,transparent .6%),radial-gradient(circle at 40% 22%,#fff 0 .3%,transparent .5%),radial-gradient(circle at 62% 8%,#fff 0 .4%,transparent .6%),linear-gradient(#0e1330 0 52%,#23336a 52% 60%,#1c2a44 60% 63%,#26361f 63%)}
.tbg.dim{filter:brightness(.55)}
.thud{position:absolute;left:0;right:0;top:0;z-index:5;padding:10px 12px 14px;background:linear-gradient(rgba(21,22,29,.85),rgba(21,22,29,0))}
.goal{display:flex;align-items:center;gap:8px;font-weight:900;font-size:.9rem}
.goal .ep-no{background:var(--orange);color:#fff;border-radius:6px;padding:1px 8px;font-size:.75rem}
.goal .turns{margin-left:auto;font-size:.78rem;color:#c9ccd9;white-space:nowrap}
.gauges{display:flex;flex-direction:column;gap:5px;margin-top:8px}
.gg{display:flex;align-items:center;gap:8px;position:relative}
.gg label{width:38px;font-size:.72rem;font-weight:900;flex:none}
.gg .bar{flex:1;height:13px;border-radius:99px;background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.5);overflow:hidden}
.gg .bar i{display:block;height:100%;width:0;border-radius:99px;transition:width .5s cubic-bezier(.3,1.2,.5,1)}
#gN i{background:linear-gradient(90deg,#7dffb0,#2fbf71)}
#gE i{background:linear-gradient(90deg,#ffd23f,#ff7a1a 55%,#ff2e88)}
.gg.hot .bar{animation:hot .2s linear infinite alternate}
.gg .delta{position:absolute;right:4px;top:-2px;font-weight:900;font-size:.85rem;opacity:0;pointer-events:none}
.gg .delta.on{animation:dpop 1.1s ease-out}
@keyframes dpop{0%{opacity:0;transform:translateY(6px)}20%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0;transform:translateY(-10px)}}
.tchars{position:absolute;left:0;right:0;top:92px;bottom:0;pointer-events:none}
.tchars .vc{bottom:150px;transition:opacity .25s,filter .25s,left .35s,bottom .25s,width .25s}
#scr-talk.choosing .tchars .vc{bottom:var(--lift,340px);width:44%;max-width:220px}
.tchars .vc.speak{filter:none}
.tbox{position:absolute;left:0;right:0;bottom:0;z-index:6;padding:0 12px 14px}
.choices{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.ch{width:100%;text-align:left;background:rgba(255,255,255,.96);color:var(--ink);border:3px solid var(--ink);border-radius:12px;padding:11px 14px;font-weight:900;font-size:.95rem;line-height:1.4;box-shadow:0 4px 0 var(--ink);animation:chin .25s ease-out both;position:relative}
.ch:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.ch.hint{border-color:#2d6cdf;background:#eaf3ff}
.ch.hint::after{content:"👀 ハセが反応している";position:absolute;right:8px;top:-11px;background:#2d6cdf;color:#fff;font-size:.66rem;padding:2px 8px;border-radius:99px}
@keyframes chin{from{opacity:0;transform:translateY(10px)}}
.tbox .vn-box{margin:0;min-height:112px;cursor:pointer}
.tbox .vn-box.me{border-color:var(--yellow)}
.tbox .vn-next.off{display:none}
.tfloat{position:absolute;left:0;right:0;top:40%;text-align:center;z-index:8;pointer-events:none;font-family:var(--logo);font-size:1.4rem;text-shadow:3px 3px 0 var(--ink);opacity:0}
.tfloat.on{animation:tfl 1.3s ease-out}
@keyframes tfl{0%{opacity:0;transform:scale(1.6)}15%{opacity:1;transform:scale(1)}80%{opacity:1}100%{opacity:0}}
.rwin{text-align:center}
.rwin .big{font-family:var(--logo);font-size:2rem;margin:4px 0 6px}
.rwin .big.ok{color:#2fbf71}.rwin .big.ng{color:#e0203a}
.rwin .stars{font-size:2rem;letter-spacing:.1em;color:#f0a500;margin-bottom:6px}
.rwin p{font-size:.88rem;font-weight:700;color:#5f6272;margin-bottom:12px;line-height:1.6}
.talk-tools{position:absolute;right:10px;top:84px;z-index:7;display:flex;gap:6px}
.talk-tools button{width:34px;height:34px;border-radius:10px;background:rgba(21,22,29,.6);font-size:.9rem;font-weight:900}
@media (max-height:680px){.tchars .vc{bottom:130px}.tbox .vn-box{min-height:96px;font-size:1.05rem}.ch{padding:9px 12px;font-size:.9rem}}
</style>
</head>
<body>
<div id="app">

<section id="scr-title" class="screen active">
  <div class="ptitle-bg"></div>
  <div class="title-in" style="background:none">
    <div class="logo"><span class="a">たかし君は</span><span class="b">我が強い</span><span class="c pers">説得編</span></div>
    <p class="psub">たかしを、言葉で動かせ。</p>
    <div class="title-tk" id="titleTk"><span class="title-hint" id="titleHint">さわると叫ぶ</span></div>
    <div class="cta">
      <button class="btn go" id="startBtn">説得をはじめる</button>
      <div class="btn row"><button class="btn" id="howBtn">あそびかた</button></div>
    </div>
    <p class="best" id="progTop"></p>
  </div>
  <button class="mute" id="muteBtn" aria-label="音のオン・オフ">🔊</button>
</section>

<section id="scr-select" class="screen">
  <div class="sel-in">
    <h2>エピソード</h2>
    <p class="note">説得に成功すると、次の話が開きます。</p>
    <div id="epList" style="display:flex;flex-direction:column;gap:12px"></div>
    <button class="btn" id="selBack" style="margin-top:10px">タイトルへ</button>
  </div>
</section>

<section id="scr-talk" class="screen">
  <div class="tbg" id="tbg"></div>
  <div class="tchars" id="tchars"></div>
  <div class="thud">
    <div class="goal"><span class="ep-no" id="epNo">第1話</span><span id="goalT"></span><span class="turns" id="turnT"></span></div>
    <div class="gauges">
      <div class="gg" id="gN"><label>納得</label><div class="bar"><i></i></div><span class="delta"></span></div>
      <div class="gg" id="gE"><label>我</label><div class="bar"><i></i></div><span class="delta"></span></div>
    </div>
  </div>
  <div class="talk-tools"><button id="skipBtn" aria-label="会話を早送り">⏩</button><button id="menuBtn" aria-label="メニュー">≡</button></div>
  <div class="tfloat" id="tfloat"></div>
  <div class="tbox">
    <div class="choices" id="choices"></div>
    <div class="vn-box" id="tBox"><span class="vn-name" id="tName"></span><div id="tText"></div><span class="vn-next" id="tNext">▼</span></div>
  </div>
</section>

<div id="shout"></div>

<div class="modal" id="resModal"><div class="sheet rwin"><div class="big" id="rBig"></div><div class="stars" id="rStars"></div><p id="rInfo"></p><div id="rBtns"></div></div></div>

<div class="modal" id="howModal">
  <div class="sheet">
    <h3>あそびかた</h3>
    <ul class="how">
      <li><span class="ic">🎯</span><span>話ごとに「たかしに〇〇させろ」という目標が出る。たかしのセリフを読んで、かける言葉を選ぶ。</span></li>
      <li><span class="ic">💚</span><span><b>納得</b>が満タンで説得成功。<b>我</b>が満タンになると、たかしが叫んで交渉決裂。ターン数にも限りがある。</span></li>
      <li><span class="ic">🧠</span><span>否定や命令、正論は我が上がる。車の話は効く。たかしは我が強いので、<b>あえて逆のことを言う</b>と…？ ただし同じ手は何度も通じない。</span></li>
      <li><span class="ic">👥</span><span>途中で知り合いが勝手に割り込んでくる。助けになるかは、相手次第。</span></li>
    </ul>
    <button class="btn go" id="howClose">わかった</button>
  </div>
</div>

<div class="modal" id="menuModal"><div class="sheet"><h3>メニュー</h3><button class="btn go" id="mResume">つづける</button><button class="btn" id="mRetry">この話を最初から</button><button class="btn" id="mSelect">エピソード選択へ</button></div></div>
</div>

const R=(a,b)=>a+Math.random()*(b-a);

const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
function load(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v);}catch(e){return d;}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function buzz(p){if(navigator.vibrate)try{navigator.vibrate(p);}catch(e){}}
function shout(t){const s=$('#shout');s.textContent=t;s.classList.remove('on');void s.offsetWidth;s.classList.add('on');}

 endu:{c:'endu',lines:['俺の話をしよう。','どけ。主役は俺だ。','お前らの話は遅い。'],n:-12,after:'（エンドゥが話題を全部持っていった）',sfx:'zoom'},
 hata:{c:'hata',lines:['オラァ！ 嵐が来たぞ！','全部ひっくり返してやる！'],storm:1,after:'（ハタ・チャンは嵐のように去っていった）',sfx:'horn'},
 kando:{c:'kando',lines:['ぐがー…'],tam:'もうカンドったら♪',e:-6,after:'（カンドはタムに連れられていった）'}};

/* ================= talk engine ================= */
const T={nodes:{},show:[],tapRes:null,typing:false,full:'',timer:0,fast:false};
function node(k){if(!T.nodes[k]){const d=document.createElement('div');d.className='vc hide';d.innerHTML=WHO[k].svg();$('#tchars').appendChild(d);T.nodes[k]=d;}return T.nodes[k];}
function layout(show,speaker){const n=show.length,pos=n===1?[50]:n===2?[28,72]:[18,50,82];
  Object.entries(T.nodes).forEach(([k,d])=>{if(!show.includes(k))d.className='vc hide';});
  show.forEach((c,i)=>{const d=node(c);const was=d.classList.contains('hide');d.className='vc'+(n===3?' n3':'')+(was?' enter':'')+(speaker&&speaker!=='narr'&&speaker!=='me'&&speaker!==c?' dim':'');d.style.left=pos[i]+'%';});}
function say(who,text,o={}){
  return new Promise(res=>{
    if(o.show)T.show=o.show;layout(T.show,who);
    const box=$('#tBox');box.classList.toggle('me',who==='me');$('#tName').textContent=who==='narr'?'':WHO[who].n;
    const tk=T.nodes.takashi&&T.nodes.takashi.querySelector('svg');if(tk)tk.classList.remove('shriek');
    const mt=T.nodes.metsuki&&T.nodes.metsuki.querySelector('svg');if(mt)mt.classList.toggle('sigh',who==='metsuki');
    if(o.fx==='shriek'||o.fx==='small'){if(tk)tk.classList.add('shriek');const sm=o.fx==='small';if(!sm)shout(pick(['キェェェェェッ!!','ヒョアアアアッ!!','ンギャアアアッ!!']));SFX.shriek(sm?.4:1);buzz(sm?[40]:[90,40,140]);
      const s=$('#scr-talk');s.classList.remove('quake');void s.offsetWidth;s.classList.add('quake');}
    if(o.fx==='bell'){SFX.bell();buzz([30,200,30]);}
    if(o.sfx)SFX[o.sfx]&&SFX[o.sfx]();
    T.full=text;T.typing=true;const el=$('#tText');el.textContent='';let k=0;const my=++T.timer;$('#tNext').classList.toggle('off',!!o.noWait);
    const p=who==='narr'||who==='me'?0:WHO[who].p;
    const step=()=>{if(my!==T.timer)return;if(k<T.full.length){const ch=T.full[k++];el.textContent+=ch;if(p&&!o.fx&&!/[、。！？…〜\s]/.test(ch)&&k%2)SFX.blip(p);setTimeout(step,T.fast?8:/[、。]/.test(ch)?130:34);}
      else done();};
    const done=()=>{if(T.cur!==cur)return;T.typing=false;T.cur=null;if(o.noWait)setTimeout(()=>res(),T.fast?60:o.delay||0);else T.tapRes=res;};
    const cur={done};T.cur=cur;
    step();});}
function tap(){if(T.typing&&T.cur){T.timer++;$('#tText').textContent=T.full;T.cur.done();return;}
  if(T.tapRes){const r=T.tapRes;T.tapRes=null;r();}}
$('#tBox').addEventListener('click',tap);
$('#tchars').addEventListener('click',tap);
async function lines(arr){for(const [w,t,o] of arr){await say(w,t,o||{});}}
function choose(texts,hint){return new Promise(res=>{const box=$('#choices');box.innerHTML='';$('#tNext').classList.add('off');
  $('#scr-talk').classList.add('choosing');
  texts.forEach((t,i)=>{const b=document.createElement('button');b.className='ch'+(i===hint?' hint':'');b.style.animationDelay=(i*.06)+'s';b.textContent=t;
    b.addEventListener('click',()=>{box.innerHTML='';$('#scr-talk').classList.remove('choosing');SFX.tone(880,.06,'triangle',.06);res(i);});box.appendChild(b);});requestAnimationFrame(()=>{const h=box.getBoundingClientRect().height+$('#tBox').getBoundingClientRect().height+22;$('#tchars').style.setProperty('--lift',h+'px');});});}

/* ================= game ================= */
let G={};
function setG(which,val,delta){const el=$(which==='n'?'#gN':'#gE');el.querySelector('i').style.width=Math.max(0,Math.min(100,val))+'%';
  if(which==='e')el.classList.toggle('hot',val>=70);
  if(delta){const d=el.querySelector('.delta');d.textContent=(delta>0?'+':'')+delta;d.style.color=which==='n'?(delta>0?'#7dffb0':'#ff9aa8'):(delta>0?'#ff9aa8':'#7dffb0');d.classList.remove('on');void d.offsetWidth;d.classList.add('on');}}
function hud(){$('#turnT').textContent=`のこり ${Math.max(0,G.max-G.turn)} ターン`;setG('n',G.n);setG('e',G.e);}
function floatT(t,c){const f=$('#tfloat');f.textContent=t;f.style.color=c;f.classList.remove('on');void f.offsetWidth;f.classList.add('on');}
function apply(dn,de){G.n=Math.max(0,Math.min(100,G.n+dn));G.e=Math.max(0,Math.min(100,G.e+de));G.maxE=Math.max(G.maxE,G.e);if(dn)setG('n',G.n,dn);if(de)setG('e',G.e,de);
  if(dn>=15)SFX.tone(1047,.15,'triangle',.07),SFX.tone(1319,.2,'triangle',.07,.08);if(de>=15)SFX.bad();}
function evalTag(tag){let n=0,e=0,line;
  switch(tag){
    case 'car':{const c=G.cnt.car++;n=Math.max(4,18-c*5);e=-6;line=pick(REP.car);break;}
    case 'rev':{const c=G.cnt.rev++;if(c<2){n=c?18:32;e=c?4:0;line=pick(REP.rev);}else{n=-5;e=28;line=pick(REP.revFail);}break;}
    case 'order':n=0;e=26;line=pick(REP.bad);break;
    case 'logic':n=6;e=18;line=pick(REP.logic);break;
    case 'yield':{const c=G.cnt.yield++;n=Math.max(5,15-c*4);e=-10;line=pick(REP.good);break;}
    case 'praise':{const c=G.cnt.praise++;n=Math.max(4,13-c*4);e=8;line=pick(REP.praise);break;}}
  n+=RI(-3,3);e+=RI(-2,3);if(G.e+e>=75&&e>0)line=pick(['……キ…キ…','キ…（限界が近い）','……キェ…']);
  return{n,e,line};}
function score(tag){const r={car:18-G.cnt.car*5,rev:G.cnt.rev<2?(G.cnt.rev?18:32):-30,order:-26,logic:-12,yield:25-G.cnt.yield*4,praise:5-G.cnt.praise*4};return r[tag];}
function makeOptions(S){const good=shuffle(['car','rev','yield','praise']),bad=shuffle(['order','logic']);
  const n=G.turn===1?3:4;const tags=shuffle([good[0],good[1],bad[0],...(n===4?[pick([good[2],bad[1]])]:[])]);
  return tags.map(t=>{const pool=S.opts[t].filter(x=>!G.usedText.has(x));const text=pick(pool.length?pool:S.opts[t]);G.usedText.add(text);return{tag:t,text};});}
function pickEvent(S){if(S.force&&S.force[G.turn]&&!G.evDone.has(S.force[G.turn]))return S.force[G.turn];
  if(G.turn<2||Math.random()>.4)return null;const pool=['ai','tatsu','ichi','fon','hase','endu','hata','kando'].filter(k=>!G.evDone.has(k)&&!(S.force&&Object.values(S.force).includes(k)));return pool.length?pick(pool):null;}
async function runEvent(k){G.evDone.add(k);const E=EVENTS[k];const keep=T.show.includes('takashi')?['takashi']:[];
  if(E.bell)await say('narr','ピンポーン',{fx:'bell',show:keep});
  if(k==='kando'){await say('kando','ぐがー…',{show:['kando','tam']});await say('tam','もうカンドったら♪');SFX.tam();}
  else if(E.all){await say(E.c,E.lines[0],{show:[E.c,...keep],sfx:E.sfx});for(const l of E.lines.slice(1))await say(E.c,l);}
  else await say(E.c,pick(E.lines),{show:[E.c,...keep],sfx:E.sfx});
  let dn=E.n||0,de=E.e||0,after=E.after;
  if(E.rand){if(Math.random()<.5){de=-8;after='（なぜか場の空気がゆるんだ）';}else after='（誰も反応しなかった）';}
  if(E.storm){dn=RI(-15,15);de=RI(-15,15);}
  if(E.hint)G.hint=true;
  await say('narr',after,{show:['takashi']});apply(dn,de);hud();}
async function playStage(i){
  const S=STAGES[i];G={stage:i,n:S.n0,e:S.e0,maxE:S.e0,turn:0,max:S.max,cnt:{car:0,rev:0,yield:0,praise:0},usedText:new Set(),evDone:new Set(),hint:false,run:Symbol()};const run=G.run;
  T.show=[];Object.values(T.nodes).forEach(d=>d.className='vc hide');$('#choices').innerHTML='';
  $('#tbg').className='tbg '+S.bg;$('#epNo').textContent=`第${i+1}話`;$('#goalT').textContent=S.title;show('scr-talk');hud();
  await lines(S.intro);if(run!==G.run)return;
  while(true){
    G.turn++;hud();
    if(G.turn>G.max){await lines([['C','これだから、たかしは',{show:['C','takashi']}],['narr','たかしは、もう話を聞かなくなった。',{show:['takashi']}]]);return finish(false,'turns');}
    const prompt=G.turn===1?S.prompts[0]:pick(S.prompts.slice(1));
    await say('takashi',prompt,{show:['takashi'],noWait:true});if(run!==G.run)return;
    const opts=makeOptions(S);let hi=-1;if(G.hint){G.hint=false;let b=-1e9;opts.forEach((o,j)=>{const s=score(o.tag);if(s>b){b=s;hi=j;}});}
    const k=await choose(opts.map(o=>o.text),hi);if(run!==G.run)return;
    await say('me',opts[k].text,{noWait:true,delay:450});
    const r=evalTag(opts[k].tag);await say('takashi',r.line,{show:['takashi']});if(run!==G.run)return;
    apply(r.n,r.e);hud();
    if(G.e>=100)return fail();
    if(G.n>=100)return win();
    const ev=pickEvent(S);if(ev){await runEvent(ev);if(run!==G.run)return;if(G.e>=100)return fail();if(G.n>=100)return win();}
  }}
async function win(){floatT('説得成功！','#7dffb0');SFX.good();await new Promise(r=>setTimeout(r,900));await lines(STAGES[G.stage].win);finish(true);}
async function fail(){await say('takashi','キェェェェェッ!!',{fx:'shriek',show:['takashi']});floatT('交渉決裂','#ff5b6e');
  await lines([['metsuki','……たかしは我が強いから。',{show:['metsuki']}],['narr','（目つきの悪いやつは、距離を取って去っていった）',{show:[]}]]);finish(false,'shriek');}
function finish(ok,why){const i=G.stage;const turns=G.turn;let stars=0;
  if(ok){stars=turns<=6&&G.maxE<50?3:turns<=8?2:1;const prog=load('pe_prog',{});if(!prog[i]||prog[i]<stars)prog[i]=stars;save('pe_prog',prog);}
  $('#rBig').textContent=ok?'説得成功！':'交渉決裂';$('#rBig').className='big '+(ok?'ok':'ng');
  $('#rStars').textContent=ok?'★'.repeat(stars)+'☆'.repeat(3-stars):'';
  $('#rInfo').innerHTML=ok?`${turns}ターンで説得／我の最高値 ${G.maxE}<br>${stars<3?'★3の条件：6ターン以内・我を50未満に保つ':'文句なしの説得'}`:
    (why==='turns'?'ターン切れ。たかしは話を聞かなくなった。':'我が限界をこえた。')+'<br>ヒント：否定と命令は逆効果。同じ手は何度も通じない。';
  const btns=$('#rBtns');btns.innerHTML='';const add=(t,cls,fn)=>{const b=document.createElement('button');b.className='btn'+(cls?' '+cls:'');b.textContent=t;b.style.marginTop='8px';b.onclick=()=>{$('#resModal').classList.remove('on');fn();};btns.appendChild(b);};
  if(ok&&i<STAGES.length-1)add('次の話へ','go',()=>playStage(i+1));
  if(ok&&i===STAGES.length-1)add('エンディングを見終えた','go',()=>{openSelect();});
  add(ok?'もう一度（★をねらう）':'もう一度説得する',ok?'':'go',()=>playStage(i));
  add('エピソード選択へ','',openSelect);
  $('#resModal').classList.add('on');}

/* ================= screens ================= */
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('active',s.id===id));}
function openSelect(){G.run=Symbol();const prog=load('pe_prog',{});const L=$('#epList');L.innerHTML='';
  STAGES.forEach((S,i)=>{const open=i===0||prog[i-1];const b=document.createElement('button');b.className='ep';b.disabled=!open;
    const st=prog[i]?'★'.repeat(prog[i])+'☆'.repeat(3-prog[i]):open?'':'🔒';
    b.innerHTML=`<span class="no">${i+1}</span><span><b>${open?S.title:'？？？'}</b><small>${open?S.sub:'前の話をクリアすると開く'}</small></span><span class="st">${st}</span>`;
    b.onclick=()=>{SFX.ac();playStage(i);};L.appendChild(b);});
  show('scr-select');}
function progTop(){const prog=load('pe_prog',{});const n=Object.keys(prog).length,s=Object.values(prog).reduce((a,b)=>a+b,0);$('#progTop').innerHTML=n?`クリア ${n}/${STAGES.length}話　★ <b>${s}</b>/${STAGES.length*3}`:'';}

SFX.good=function(){[1047,1319,1568].forEach((f,i)=>this.tone(f,.25,'sine',.1,i*.07));};
SFX.bad=function(){this.tone(196,.18,'square',.05);};

$('#titleTk').insertAdjacentHTML('beforeend',svgTakashi());
let tst=0;$('#titleTk').addEventListener('click',()=>{SFX.ac();const s=$('#titleTk svg');s.classList.add('shriek');shout(pick(['キェェェェェッ!!','ヒョアアアアッ!!']));SFX.shriek(.8);buzz(60);$('#titleHint').style.display='none';clearTimeout(tst);tst=setTimeout(()=>s.classList.remove('shriek'),1100);});
$('#startBtn').addEventListener('click',()=>{SFX.ac();if(!load('pe_seen',false)){save('pe_seen',true);$('#howModal').classList.add('on');$('#howClose').onclick=()=>{$('#howModal').classList.remove('on');openSelect();};}else openSelect();});
$('#howBtn').addEventListener('click',()=>{$('#howModal').classList.add('on');$('#howClose').onclick=()=>$('#howModal').classList.remove('on');});
$('#selBack').addEventListener('click',()=>{progTop();show('scr-title');});
$('#muteBtn').textContent=SFX.on?'🔊':'🔇';
$('#muteBtn').addEventListener('click',()=>{SFX.on=!SFX.on;save('dr_sound',SFX.on);$('#muteBtn').textContent=SFX.on?'🔊':'🔇';if(SFX.on)SFX.ac();});
$('#skipBtn').addEventListener('click',e=>{e.stopPropagation();T.fast=!T.fast;$('#skipBtn').style.background=T.fast?'var(--orange)':'';});
$('#menuBtn').addEventListener('click',e=>{e.stopPropagation();$('#menuModal').classList.add('on');});
$('#mResume').addEventListener('click',()=>$('#menuModal').classList.remove('on'));
$('#mRetry').addEventListener('click',()=>{$('#menuModal').classList.remove('on');playStage(G.stage);});
$('#mSelect').addEventListener('click',()=>{$('#menuModal').classList.remove('on');openSelect();});
progTop();
</script>
